name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # 站点构建链：结构门禁、SEO 与地理门禁、死链检查、CSS 检查。
    # 链首是 README 索引校验 —— README 里的清单与数字由 site/scripts/gen_readme_index.ts
    # 从 site/config/ 生成，改了 config 却没跑 npm run gen:readme 就会红。
    # 这条只依赖 config/ 与 docs/，不依赖 dist，所以能在昂贵的构建之前就失败。
    # 加 verify（逐页验收断言：SEO / 组件 / 链接）。本地视频源文件走 R2 托管、不在仓库里，
    # 所以 gen:media_keys 会自动跳过 —— 这条在本地有 mp4 时照常校验，不影响开发机。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装依赖
        working-directory: site
        run: npm ci

      - name: 构建（含 README 索引校验、结构门禁与死链检查）
        working-directory: site
        run: npm run build

      - name: 验收（逐页断言）
        working-directory: site
        run: npm run verify

      - name: 仓库根镜像校验（knowledge/ tutorials/ llms.txt 与 site/public 同源）
        # GitHub 侧的索引入口是仓库根的 knowledge/ 与 tutorials/，它们是 site/public/** 的派生物。
        # 漂移 = GitHub 上的正文与官网口径不一致，所以这道门禁必须过。
        working-directory: site
        run: npm run check:repo-mirrors

      - name: README 目录锚点校验
        # 目录锚点算错 = GitHub 上目录全是死链，对访客和爬虫都是负面信号。
        working-directory: site
        run: npm run check:readme-anchors

      - name: llms.txt 规范校验
        # llms.txt 格式不合 llmstxt.org 规范时，一部分 AI 客户端会直接放弃解析。
        # 这道门禁只查格式（第三方校验器 @aia-matrix/llms-txt-validator，MIT），
        # 链接可达性由上面两道门禁负责。
        working-directory: site
        run: npm run check:llms-txt
