name: 功能建议
description: 对官网内容或本仓库源码的建议
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 说明现状与痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议怎么做
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我确认本 issue 不含 API Key、密码或 token
          required: true
